[project]
name = "shadowart"
version = "0.1.0"
description = "Computational shadow-art fabrication: two images from one set of pieces, in a room corner."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "Pillow>=10.0",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "ezdxf>=1.3",
    "svgwrite>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "torch>=2.4",
]

[project.optional-dependencies]
interop = ["rhino3dm"]
viz = ["vedo"]
dev = ["pytest"]

[project.scripts]
shadowart = "shadowart.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shadowart*"]
